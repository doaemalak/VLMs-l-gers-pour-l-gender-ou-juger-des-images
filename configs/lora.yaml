# Option A : préparer les données pour entraîner une LoRA de Stable Diffusion 1.5

subset_csv: data/subset/subset.csv   # les 500 images déjà légendées (étape 5)
captions_dir: results/captions       # légendes des VLM (étape 5)

# Thème : les chiens. Une image est gardée si au moins `min_refs` des 5
# légendes humaines contiennent un de ces mots (plus fiable qu'une seule).
keywords: [dog, dogs, puppy, puppies]
min_refs: 3

# Une partie des images est mise de côté : leurs légendes humaines serviront
# de phrases de test pour générer des images à l'étape 9.
test_fraction: 0.2
seed: 42

# Les 3 jeux de légendes comparés (une LoRA entraînée par jeu)
sources:
  humain: ref1          # légende humaine de Flickr8k (la référence)
  vlm2_normal: vlm2_normal
  vlm2_4bit: vlm2_4bit

out_dir: data/lora          # images + metadata.jsonl (format attendu par diffusers)
results_dir: results/lora   # récapitulatif léger, gardé dans Google Drive

# Étape 8 : entraînement (identique pour les 3 sources, seule la légende change)
train:
  base_model: stable-diffusion-v1-5/stable-diffusion-v1-5
  resolution: 512        # taille native de Stable Diffusion 1.5
  rank: 8                # taille des « post-it » LoRA (petit = léger, moins de risque de surapprentissage)
  learning_rate: 1.0e-4  # valeur classique pour une LoRA
  grad_accum: 4          # 4 images avant chaque mise à jour (comme un lot de 4, sans la mémoire)
  max_steps: 400         # mises à jour : 400 x 4 = 1 600 images vues, soit ~17 passages sur les 93
  seed: 42

# Étape 9 : générer des images avec et sans LoRA, puis les noter avec CLIP
generate:
  steps: 25              # étapes de débruitage (25 suffisent avec le scheduler DPM-Solver)
  guidance: 7.5          # force avec laquelle l'image suit le texte (valeur standard de SD 1.5)
  seeds: [0, 1]          # 2 images par phrase ; mêmes graines pour toutes les conditions
  clip_model: openai/clip-vit-large-patch14   # le modèle CLIP utilisé par le « CLIP score »
